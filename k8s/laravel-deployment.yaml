apiVersion: apps/v1

kind: Deployment

metadata:
  name: laravel-app

spec:
  replicas: 1

  selector:
    matchLabels:
      app: laravel-app

  template:
    metadata:
      labels:
        app: laravel-app

    spec:
      containers:
        - name: laravel-app

          image: second-dockerization-app:latest

          imagePullPolicy: Never

          ports:
            - containerPort: 9000

          env:
            - name: DB_CONNECTION
              value: mysql

            - name: DB_HOST
              value: mysql-service

            - name: DB_PORT
              value: "3306"

            - name: DB_DATABASE
              valueFrom:
                secretKeyRef:
                  name: laravel-secret
                  key: DB_DATABASE

            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: laravel-secret
                  key: DB_USERNAME

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: laravel-secret
                  key: DB_PASSWORD